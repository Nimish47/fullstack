<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tables</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <table class="table-container">
            <caption>Weirdo table</caption>

            <thead>
                <tr>
                    <th colspan="4">Student Info</th>
                </tr>
                <tr>
                    <th rowspan="2">Sr. No.</th>
                    <th rowspan="2">Name</th>
                    <th colspan="2">Contact</th>
                </tr>
                <tr>
                    <th>1</th>
                    <th>2</th>
                </tr>
            </thead>
            <tr>
                <td>1</td>
                <td>Nishant Nimish</td>
                <td>1234</td>
                <td>5678</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Amit Mishra</td>
                <td>2233</td>
                <td>9988</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Kunal Khemu</td>
                <td>9988</td>
                <td>6655</td>
            </tr>                        
            <tbody>
            </tbody>

        </table>
    </div>
</body>

</html>
