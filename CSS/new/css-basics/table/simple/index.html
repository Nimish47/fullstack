<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tables</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <table class="table-container">
            <caption>A simple table</caption>

            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Count</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Banana</td>
                    <td>Fruits</td>
                    <td>$23</td>
                    <td>200</td>
                </tr>
                <tr>
                    <td>Laptop</td>
                    <td>Electronics</td>
                    <td>$999</td>
                    <td>40</td>
                </tr>
                <tr>
                    <td>Eggs</td>
                    <td>Grocery</td>
                    <td>$5</td>
                    <td>100</td>
                </tr>
                <tr>
                    <td>Gilette Turbo</td>
                    <td>Grooming</td>
                    <td>$99</td>
                    <td>10</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3">Inventory Count</td>
                    <td>350</td>
                </tr>
            </tfoot>
            
        </table>
    </div>
</body>

</html>
